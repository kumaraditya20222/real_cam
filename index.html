<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real Camera Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* 🔑 IMPORTANT: NO mirror */
      transform: scaleX(1);
    }

    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 16px;
      font-family: sans-serif;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="label">Real (Non-Mirrored) Front Camera</div>
  <video id="video" autoplay playsinline></video>

  <script>
    const video = document.getElementById('video');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user" // front camera
          },
          audio: false
        });

        video.srcObject = stream;

      } catch (err) {
        alert("Camera access denied or not available");
        console.error(err);
      }
    }

    startCamera();
  </script>

</body>
</html>
